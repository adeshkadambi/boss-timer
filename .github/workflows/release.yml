name: Release

# Push a tag like v0.1.0 to build the installers and attach them to a GitHub release:
#   macOS: universal .dmg (Apple Silicon + Intel)
#   Ubuntu: .deb and .AppImage
# plus the in-app updater's files: latest.json and signed update bundles (.app.tar.gz, .AppImage).
# They're signed with the TAURI_SIGNING_PRIVATE_KEY secret; the app checks them against the
# public key in tauri.conf.json, so only builds from this workflow can update an installed app.
#
# Releases are public and published right away (not drafts): installed apps find updates through
# the releases/latest URL. So these builds contain no Google client; each machine pastes its own
# in Settings > Accounts once. Don't pass BOSS_TIMER_GOOGLE_CLIENT_* here: anything compiled in
# can be extracted from a public download.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
          - platform: ubuntu-22.04
            args: --bundles deb,appimage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libdbus-1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Check the update signing key is set
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY isn't set, so the update files can't be signed. See README > Making a release."
            exit 1
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # The key has no password.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Boss Timer ${{ github.ref_name }}
          releaseDraft: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
